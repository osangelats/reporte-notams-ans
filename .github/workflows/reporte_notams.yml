name: Reporte Diario NOTAMs ANS

on:
  schedule:
    # Lunes a Viernes a las 9:00 AM hora Lima (14:00 UTC)
    - cron: '0 14 * * 1-5'
  # Permite ejecutarlo manualmente en cualquier momento desde tu celular o PC
  workflow_dispatch:

jobs:
  generar-reporte:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install openpyxl

      - name: Generar PDF unificado y subir a Google Drive
        env:
          DRIVE_WEBHOOK_URL: ${{ secrets.DRIVE_WEBHOOK_URL }}
          DRIVE_WEBHOOK_SECRET: ${{ secrets.DRIVE_WEBHOOK_SECRET }}
        run: python generar_reporte_unificado.py

      - name: Adjuntar PDF para descarga directa
        uses: actions/upload-artifact@v4
        with:
          name: reporte-notams-ans
          path: REPORTE NOTAMS/*REPORTE NOTAMS ANS.pdf
          retention-days: 7
