name: Reporte Diario NOTAMs ANS

on:
  schedule:
    # Lunes a viernes a las 09:00 de Lima (UTC-5): 14:00 UTC.
    # GitHub Actions puede iniciar la ejecución con retraso por disponibilidad.
    - cron: '0 14 * * 1-5'
    # Prueba del 25 NOV 2026 a las 17:50 de Lima (22:50 UTC).
    - cron: '50 22 25 11 *'
  # Permite ejecutarlo manualmente en cualquier momento desde tu celular o PC
  workflow_dispatch:

jobs:
  validar-fecha:
    runs-on: ubuntu-latest
    outputs:
      ejecutar: ${{ steps.fecha.outputs.ejecutar }}
    steps:
      - name: Limitar la prueba al 25 de noviembre de 2026
        id: fecha
        env:
          HORARIO: ${{ github.event.schedule }}
        run: |
          if [[ "$HORARIO" == '50 22 25 11 *' && "$(date -u +%F)" != '2026-11-25' ]]; then
            echo "ejecutar=false" >> "$GITHUB_OUTPUT"
          else
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
          fi

  generar-reporte:
    needs: validar-fecha
    if: needs.validar-fecha.outputs.ejecutar == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install openpyxl

      - name: Generar PDF unificado y subir a Google Drive
        env:
          DRIVE_WEBHOOK_URL: ${{ secrets.DRIVE_WEBHOOK_URL }}
          DRIVE_WEBHOOK_SECRET: ${{ secrets.DRIVE_WEBHOOK_SECRET }}
        run: python generar_reporte_unificado.py

      - name: Adjuntar PDF para descarga directa
        uses: actions/upload-artifact@v4
        with:
          name: reporte-notams-ans
          path: REPORTE NOTAMS/*REPORTE NOTAMS ANS.pdf
          retention-days: 7
