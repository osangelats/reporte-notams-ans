name: Reporte Diario NOTAMs ANS

on:
  schedule:
    # Lunes a Viernes a las 8:17 AM hora Lima (13:17 UTC) para absorber colas de GitHub antes de las 9:00 AM
    - cron: '17 13 * * 1-5'
    # Prueba puntual de hoy miércoles a las 11:56 AM hora Lima (16:56 UTC) sin Antigravity
    - cron: '56 16 * * 3'
  # Permite ejecutarlo manualmente en cualquier momento desde tu celular o PC
  workflow_dispatch:

jobs:
  generar-reporte:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install openpyxl

      - name: Generar PDF unificado y subir a Google Drive
        env:
          DRIVE_WEBHOOK_URL: ${{ secrets.DRIVE_WEBHOOK_URL }}
          DRIVE_WEBHOOK_SECRET: ${{ secrets.DRIVE_WEBHOOK_SECRET }}
        run: python generar_reporte_unificado.py

      - name: Adjuntar PDF para descarga directa
        uses: actions/upload-artifact@v4
        with:
          name: reporte-notams-ans
          path: REPORTE NOTAMS/*REPORTE NOTAMS ANS.pdf
          retention-days: 7
